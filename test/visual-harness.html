<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>pet-fuyuko visual harness</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        font: 13px/1.5 "Microsoft YaHei", system-ui, sans-serif;
        background: #fcfcfd; color: #2b2b33;
      }
      /* A believable chat shell so the pet's seat can be judged. */
      .shell { display: grid; grid-template-columns: 220px 1fr; height: 100%; }
      .side { background: #f6f6f8; border-right: .5px solid #e8e8ec; padding: 16px; }
      .side b { font-size: 15px; }
      .side div.item { padding: 6px 8px; border-radius: 8px; color: #5b5b68; margin-top: 4px; }
      .side div.item.on { background: #e8ecf5; color: #2b2b33; }
      .main { position: relative; display: flex; flex-direction: column; }
      .head { padding: 14px 20px; border-bottom: .5px solid #eee; font-weight: 600; }
      .log { flex: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
      .u { align-self: flex-end; background: #deebfc; border-radius: 12px; padding: 8px 12px; max-width: 60%; }
      .a { background: #f5f5f7; border-radius: 12px; padding: 8px 12px; max-width: 62%; }
      .composer { margin: 0 20px 16px; border: .5px solid #e2e2e8; border-radius: 14px; padding: 12px 14px; color: #aaa; background: #fff; }
      /* The frame-wide overlay mirrors the host: fixed to the whole window (the
         real AppFrame spans every column), pointer-events none, every direct
         child re-enabled — which is why the pet sets its own value back. */
      .overlay { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
      .overlay > * { pointer-events: auto; }
      .hud { position: fixed; left: 8px; bottom: 8px; font: 11px/1.4 ui-monospace, monospace; color: #888; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="side">
        <b>DeepSeek Harness</b>
        <div class="item on">桌宠设计</div>
        <div class="item">自升级</div>
        <div class="item">ComfyUI 测试</div>
      </div>
      <div class="main">
        <div class="head">桌宠设计 · M0 视觉验收</div>
        <div class="log">
          <div class="u">帮我看看这个余额接口对不对？</div>
          <div class="a">接口没问题，返回 is_available 和 balance_infos[]，需要 Bearer token。</div>
          <div class="u">那她能不能顺便帮我看着点？</div>
        </div>
        <div class="composer">输入消息…</div>
        <div class="overlay" id="overlay"></div>
      </div>
    </div>
    <div class="hud" id="hud">boot…</div>

    <script>
      // ── tiny React stand-in: hooks + a direct DOM renderer ──────────────
      // Only what lib/client.js actually uses, so the harness exercises the
      // real component instead of a lookalike.
      (function () {
        const slots = [];
        let cursor = 0;
        let rootEl = null;
        let rootComp = null;
        let dirty = false;

        const React = {
          createElement(type, props, ...children) {
            return { type, props: props || {}, children: children.flat(Infinity) };
          },
          useRef(init) {
            const i = cursor++;
            if (!(i in slots)) slots[i] = { current: init };
            return slots[i];
          },
          useState(init) {
            const i = cursor++;
            if (!(i in slots)) slots[i] = typeof init === "function" ? init() : init;
            return [
              slots[i],
              (next) => {
                const v = typeof next === "function" ? next(slots[i]) : next;
                if (v !== slots[i]) {
                  slots[i] = v;
                  schedule();
                }
              }
            ];
          },
          useCallback(fn) {
            cursor++;
            return fn;
          },
          useEffect(fn) {
            const i = cursor++;
            const prev = slots[i];
            slots[i] = { fn, deps: undefined };
            queueMicrotask(() => {
              if (typeof prev === "function") prev();
              const cleanup = fn();
              slots[i] = typeof cleanup === "function" ? cleanup : null;
            });
          }
        };

        function schedule() {
          if (dirty) return;
          dirty = true;
          queueMicrotask(() => {
            dirty = false;
            render();
          });
        }

        function applyStyle(el, style) {
          for (const k in style) {
            const v = style[k];
            if (k.startsWith("--")) el.style.setProperty(k, v);
            else el.style[k] = v;
          }
        }

        function toDom(node) {
          if (node === null || node === undefined || node === false) return null;
          if (typeof node === "string" || typeof node === "number") return document.createTextNode(String(node));
          if (Array.isArray(node)) {
            const f = document.createDocumentFragment();
            for (const child of node) {
              const d = toDom(child);
              if (d) f.appendChild(d);
            }
            return f;
          }
          const el = document.createElement(node.type);
          for (const k in node.props) {
            const v = node.props[k];
            if (v === undefined || v === null || v === false) continue;
            if (k === "style" && typeof v === "object") applyStyle(el, v);
            else if (k === "className") el.className = v;
            else if (k === "ref") v.current = el;
            else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2).toLowerCase(), v);
            else if (k === "draggable") el.draggable = !!v;
            else el.setAttribute(k, v === true ? "" : String(v));
          }
          for (const child of node.children) {
            const d = toDom(child);
            if (d) el.appendChild(d);
          }
          return el;
        }

        function render() {
          if (!rootEl || !rootComp) return;
          cursor = 0;
          const tree = rootComp({ useSessions: (sel) => sel({ current: "session-harness" }) });
          const dom = toDom(tree);
          rootEl.replaceChildren();
          if (dom) rootEl.appendChild(dom);
        }

        // ── loader facade the bundle expects ─────────────────────────────
        window.__ModuleLoader__ = {
          load(reg) {
            const mod = reg.factory((spec) => {
              if (spec === "react") return React;
              throw new Error("unexpected external " + spec);
            });
            window.__petMod = mod;
          }
        };

        window.__harness = {
          mount(el, mod) {
            rootEl = el;
            rootComp = mod.PetLayer;
            render();
          }
        };
      })();
    </script>

    <!-- The real client bundle. In the app this is served as
         /plugins/??dsh-pet-fuyuko/client.js&rev=… ; the harness aliases it to
         /bundle.js because a combo URL's "?" starts a query, not a path. -->
    <script src="/bundle.js"></script>
    <script>
      const hud = document.getElementById("hud");
      const overlay = document.getElementById("overlay");
      window.__harness.mount(overlay, window.__petMod);
      // The component fetches pet.json before rendering; report once it appears.
      let tries = 0;
      const timer = setInterval(() => {
        const pet = overlay.querySelector(".dpf-pet");
        tries++;
        if (pet) {
          clearInterval(timer);
          const r = pet.getBoundingClientRect();
          hud.textContent =
            "pet mounted · " +
            Math.round(r.width) + "×" + Math.round(r.height) +
            " @ " + Math.round(r.left) + "," + Math.round(r.top) +
            " · state=" + pet.dataset.state;
          window.__PET_OK__ = {
            width: Math.round(r.width),
            height: Math.round(r.height),
            left: Math.round(r.left),
            top: Math.round(r.top),
            state: pet.dataset.state,
            animation: getComputedStyle(pet).animationName,
            sprite: pet.querySelector("img").currentSrc || pet.querySelector("img").src
          };
        } else if (tries > 40) {
          clearInterval(timer);
          hud.textContent = "pet never mounted";
          window.__PET_OK__ = null;
        }
      }, 50);
    </script>
  </body>
</html>
