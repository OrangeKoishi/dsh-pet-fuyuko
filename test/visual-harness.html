<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>pet-fuyuko visual harness</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        font: 13px/1.5 "Microsoft YaHei", system-ui, sans-serif;
        background: #fcfcfd; color: #2b2b33;
      }
      /* A believable chat shell so the pet's seat can be judged. */
      .shell { display: grid; grid-template-columns: 220px 1fr; height: 100%; }
      .side { background: #f6f6f8; border-right: .5px solid #e8e8ec; padding: 16px; }
      .side b { font-size: 15px; }
      .side div.item { padding: 6px 8px; border-radius: 8px; color: #5b5b68; margin-top: 4px; }
      .side div.item.on { background: #e8ecf5; color: #2b2b33; }
      .main { position: relative; display: flex; flex-direction: column; }
      .head { padding: 14px 20px; border-bottom: .5px solid #eee; font-weight: 600; }
      .log { flex: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
      .u { align-self: flex-end; background: #deebfc; border-radius: 12px; padding: 8px 12px; max-width: 60%; }
      .a { background: #f5f5f7; border-radius: 12px; padding: 8px 12px; max-width: 62%; }
      .composer { margin: 0 20px 16px; border: .5px solid #e2e2e8; border-radius: 14px; padding: 12px 14px; color: #aaa; background: #fff; }
      /* The frame-wide overlay mirrors the host: fixed to the whole window (the
         real AppFrame spans every column), pointer-events none, every direct
         child re-enabled — which is why the pet sets its own value back. */
      .overlay { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
      .overlay > * { pointer-events: auto; }
      .hud { position: fixed; left: 8px; bottom: 8px; font: 11px/1.4 ui-monospace, monospace; color: #888; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="side">
        <b>DeepSeek Harness</b>
        <div class="item on">桌宠设计</div>
        <div class="item">自升级</div>
        <div class="item">ComfyUI 测试</div>
      </div>
      <div class="main">
        <div class="head">桌宠设计 · M0 视觉验收</div>
        <div class="log">
          <div class="u">帮我看看这个余额接口对不对？</div>
          <div class="a">接口没问题，返回 is_available 和 balance_infos[]，需要 Bearer token。</div>
          <div class="u">那她能不能顺便帮我看着点？</div>
        </div>
        <div class="composer">输入消息…</div>
        <div class="overlay" id="overlay"></div>
      </div>
    </div>
    <div class="hud" id="hud">boot…</div>

    <script>
      // ── tiny React stand-in: hooks + a direct DOM renderer ──────────────
      // Only what lib/client.js actually uses, so the harness exercises the
      // real component instead of a lookalike.
      (function () {
        const slots = [];
        let cursor = 0;
        let rootEl = null;
        let rootComp = null;
        let dirty = false;

        const React = {
          createElement(type, props, ...children) {
            return { type, props: props || {}, children: children.flat(Infinity) };
          },
          useRef(init) {
            const i = cursor++;
            if (!(i in slots)) slots[i] = { current: init };
            return slots[i];
          },
          useState(init) {
            const i = cursor++;
            if (!(i in slots)) slots[i] = typeof init === "function" ? init() : init;
            return [
              slots[i],
              (next) => {
                const v = typeof next === "function" ? next(slots[i]) : next;
                if (v !== slots[i]) {
                  slots[i] = v;
                  schedule();
                }
              }
            ];
          },
          /**
           * Memoized callback: same identity while deps are equal, like React.
           * Without this every render would hand new function identities to the
           * effects below, restarting their timers on each render.
           */
          useCallback(fn, deps) {
            const i = cursor++;
            const prev = slots[i];
            const same =
              prev &&
              Array.isArray(deps) &&
              Array.isArray(prev.deps) &&
              deps.length === prev.deps.length &&
              deps.every((d, k) => Object.is(d, prev.deps[k]));
            if (same) return prev.fn;
            slots[i] = { fn, deps: Array.isArray(deps) ? deps.slice() : undefined };
            return fn;
          },
          /**
           * Effects honour their dependency array, exactly like React: a missing
           * or changed dep re-runs the effect (after the previous cleanup), and an
           * unchanged dep array is a no-op. Ignoring deps here would run every
           * cleanup on every render — which silently cancelled the bubble timer
           * and made a spoken line stick on screen forever.
           */
          useEffect(fn, deps) {
            const i = cursor++;
            const prev = slots[i];
            const prevDeps = prev && prev.deps;
            const same =
              Array.isArray(deps) &&
              Array.isArray(prevDeps) &&
              deps.length === prevDeps.length &&
              deps.every((d, k) => Object.is(d, prevDeps[k]));
            if (same) return;
            slots[i] = { deps: Array.isArray(deps) ? deps.slice() : undefined, cleanup: null };
            const record = slots[i];
            queueMicrotask(() => {
              if (prev && typeof prev.cleanup === "function") prev.cleanup();
              const cleanup = fn();
              record.cleanup = typeof cleanup === "function" ? cleanup : null;
            });
          },
          /**
           * Real subscription: re-render whenever the store notifies, so the
           * harness exercises the same path useSyncExternalStore would take.
           */
          useSyncExternalStore(subscribe, getSnapshot) {
            const i = cursor++;
            if (!(i in slots)) {
              slots[i] = { value: getSnapshot() };
              const record = slots[i];
              record.unsubscribe = subscribe(() => {
                record.value = getSnapshot();
                schedule();
              });
            }
            return slots[i].value;
          }
        };

        function schedule() {
          if (dirty) return;
          dirty = true;
          queueMicrotask(() => {
            dirty = false;
            render();
          });
        }

        function applyStyle(el, style) {
          for (const k in style) {
            const v = style[k];
            if (k.startsWith("--")) el.style.setProperty(k, v);
            else el.style[k] = v;
          }
        }

        function toDom(node) {
          if (node === null || node === undefined || node === false) return null;
          if (typeof node === "string" || typeof node === "number") return document.createTextNode(String(node));
          if (Array.isArray(node)) {
            const f = document.createDocumentFragment();
            for (const child of node) {
              const d = toDom(child);
              if (d) f.appendChild(d);
            }
            return f;
          }
          const el = document.createElement(node.type);
          for (const k in node.props) {
            const v = node.props[k];
            if (v === undefined || v === null || v === false) continue;
            if (k === "style" && typeof v === "object") applyStyle(el, v);
            else if (k === "className") el.className = v;
            else if (k === "ref") v.current = el;
            else if (k.startsWith("on") && typeof v === "function") {
              const event = k.slice(2).toLowerCase();
              el.addEventListener(event, v);
              // React's onChange for text inputs is really the `input` event, not
              // the native `change` (which only fires on blur). Mapping only
              // `change` made controlled inputs look frozen in this harness.
              if (event === "change") el.addEventListener("input", v);
            }
            else if (k === "draggable") el.draggable = !!v;
            else el.setAttribute(k, v === true ? "" : String(v));
          }
          for (const child of node.children) {
            const d = toDom(child);
            if (d) el.appendChild(d);
          }
          return el;
        }

        function render() {
          if (!rootEl || !rootComp) return;
          cursor = 0;
          const tree = rootComp({ useSessions: (sel) => sel({ current: "session-harness" }) });
          const dom = toDom(tree);
          rootEl.replaceChildren();
          if (dom) rootEl.appendChild(dom);
        }

        // ── loader facade the bundle expects ─────────────────────────────
        window.__ModuleLoader__ = {
          load(reg) {
            const mod = reg.factory((spec) => {
              if (spec === "react") return React;
              throw new Error("unexpected external " + spec);
            });
            window.__petMod = mod;
          }
        };

        window.__harness = {
          mount(el, mod) {
            rootEl = el;
            rootComp = mod.PetLayer;
            render();
          }
        };
      })();
    </script>

    <!-- The real client bundle. In the app this is served as
         /plugins/??dsh-pet-fuyuko/client.js&rev=… ; the harness aliases it to
         /bundle.js because a combo URL's "?" starts a query, not a path. -->
    <script src="/bundle.js"></script>
    <script>
      const hud = document.getElementById("hud");
      const overlay = document.getElementById("overlay");
      // The HUD is diagnostic text; hide it unless the URL asks for it so the
      // same page can produce a clean screenshot for the README.
      const showHud = new URLSearchParams(location.search).has("hud");
      if (!showHud) hud.style.display = "none";
      window.__harness.mount(overlay, window.__petMod);

      // Drive the real signal store the way the session bridge would, so the
      // pet's subscription path is exercised without a live conversation.
      // `?activity=think` sets the initial state; the console helpers below
      // switch it at runtime.
      const initialActivity = new URLSearchParams(location.search).get("activity");
      const signal = window.__petMod.__test;
      if (initialActivity) signal.publishSignal({ activity: initialActivity, sessionId: "harness" });
      window.petActivity = (name) => signal.publishSignal({ activity: name, sessionId: "harness" });
      window.petClear = () => signal.clearSignal();
      window.petSignal = () => signal.getSignal();
      // M2 persona helpers, for driving the bubble/menu from the console.
      window.petProbe = () => (window.__petProbe ? window.__petProbe() : null);
      window.petSetMode = (mode) => {
        const st = signal.readPetState();
        st.mode = mode;
        signal.writePetState(st);
        // The component reads state at mount; a reload is the honest way to
        // re-seed it in this harness.
        return st;
      };
      // The component fetches pet.json before rendering; report once it appears.
      let tries = 0;
      const timer = setInterval(() => {
        const pet = overlay.querySelector(".dpf-pet");
        tries++;
        if (pet) {
          clearInterval(timer);
          const r = pet.getBoundingClientRect();
          hud.textContent =
            "pet mounted · " +
            Math.round(r.width) + "×" + Math.round(r.height) +
            " @ " + Math.round(r.left) + "," + Math.round(r.top) +
            " · state=" + pet.dataset.state;
          window.__PET_OK__ = {
            width: Math.round(r.width),
            height: Math.round(r.height),
            left: Math.round(r.left),
            top: Math.round(r.top),
            state: pet.dataset.state,
            animation: getComputedStyle(pet).animationName,
            sprite: pet.querySelector("img").currentSrc || pet.querySelector("img").src
          };
        } else if (tries > 40) {
          clearInterval(timer);
          hud.textContent = "pet never mounted";
          window.__PET_OK__ = null;
        }
      }, 50);
    </script>
  </body>
</html>
